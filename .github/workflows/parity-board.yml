name: Parity Board

on:
  push:
    branches: [master]
    paths:
      - 'parity-board/**'
      - 'src/game/**'
      - 'parity.json'
      - 'package-lock.json'
      - 'scripts/update-parity-board.sh'
      - '.github/workflows/parity-board.yml'
  pull_request:
    branches: [master]
    paths:
      - 'parity-board/**'
      - 'src/game/**'
      - 'parity.json'
      - 'package-lock.json'
      - 'scripts/update-parity-board.sh'
      - '.github/workflows/parity-board.yml'
  workflow_dispatch:

concurrency:
  group: parity-board-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            parity-board/package-lock.json

      # Root deps are required: Vite loads ../src/game via @game and resolves
      # the repo-root tsconfig.app.json (extends @vue/tsconfig).
      - name: Install root
        run: npm ci

      - name: Install parity-board
        working-directory: parity-board
        run: npm ci

      - name: Typecheck & build
        working-directory: parity-board
        run: npm run build

      - name: Upload dist
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: parity-board-dist
          path: parity-board/dist
          retention-days: 14

  # Live server: commit dirty parity.json, pull, rebuild dist in place.
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/master')
    needs: build
    runs-on: [self-hosted, parity-server]
    steps:
      - name: Sync parity.json, pull, rebuild
        working-directory: /root/angband-phaser-port
        run: ./scripts/update-parity-board.sh
