name: Parity Board

on:
  push:
    branches: [master]
    paths:
      - 'parity-board/**'
      - 'src/game/**'
      - 'parity.json'
      - '.github/workflows/parity-board.yml'
  pull_request:
    branches: [master]
    paths:
      - 'parity-board/**'
      - 'src/game/**'
      - 'parity.json'
      - '.github/workflows/parity-board.yml'
  workflow_dispatch:

concurrency:
  group: parity-board-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parity-board
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: parity-board/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck & build
        run: npm run build

      - name: Upload dist
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@v4
        with:
          name: parity-board-dist
          path: parity-board/dist
          retention-days: 14
